services:
  sensor-cluster:
    build:
      context: ./sensor-cluster/
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - --cluster-id=C1
      - --base-url=http://server
      - --config-interval-s=5
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ./sensor-server
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 0s

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true

  mock-producer:
    build:
      context: ./mock-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=water-quality-readings

  spark-master:
    image: apache/spark:3.5.5
    container_name: spark-master
    hostname: spark-master
    user: root
    command: >
      /bin/bash
      /opt/spark-apps/start-master-and-streaming-job.sh
    ports:
      - "7077:7077"
      - "8081:8080"
      - "4040:4040"
    volumes:
      - ./spark-apps:/opt/spark-apps
      - spark_checkpoints:/tmp/water-quality-checkpoints
      - spark_ivy:/tmp/spark-ivy
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.5
    container_name: spark-worker
    hostname: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 2
      --memory 2g
      spark://spark-master:7077
    ports:
      - "8082:8081"
    volumes:
      - ./spark-apps:/opt/spark-apps
    depends_on:
      - spark-master

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    command: >
      /bin/bash
      /opt/cassandra-setup/start-cassandra-with-schema.sh
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: water-quality-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra:/opt/cassandra-setup:ro
    healthcheck:
      test: [ "CMD-SHELL", "/opt/cassandra/bin/cqlsh 127.0.0.1 9042 -e 'DESCRIBE TABLE water_quality.readings_daily_by_location_parameter' >/dev/null 2>&1" ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s



volumes:
  cassandra_data:
  spark_checkpoints:
  spark_ivy:
