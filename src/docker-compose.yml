services:
  sensor-cluster-1:
    build:
      context: ./sensor-cluster/
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - --cluster-id=C1
      - --base-url=http://sensor-server
      - --config-interval-s=5
    depends_on:
      sensor-server:
        condition: service_healthy

  sensor-cluster-2:
    build:
      context: ./sensor-cluster/
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - --cluster-id=C2
      - --base-url=http://sensor-server
      - --config-interval-s=5
    depends_on:
      sensor-server:
        condition: service_healthy

  sensor-server:
    build:
      context: ./sensor-server
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 0s
    depends_on:
      cassandra:
        condition: service_healthy

  dashboard-backend:
    build:
      context: ./dashboard-backend
    environment:
      - PYTHONUNBUFFERED=1
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=water_quality
      - DEFAULT_LOCATION_ID=demo_location_01
    ports:
      - "8001:80"
    depends_on:
      cassandra:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true

  mock-producer:
    build:
      context: ./mock-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=water-quality-readings

  notification-service:
    build:
      context: ./notification-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ALERTS_TOPIC=water-quality-alerts
      - KAFKA_GROUP_ID=water-quality-notification-service
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-Water Quality Monitoring}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - NOTIFICATION_RECIPIENTS=${NOTIFICATION_RECIPIENTS:-}
      - NOTIFICATION_DRY_RUN=${NOTIFICATION_DRY_RUN:-true}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_SUBSCRIBERS_FILE=${TELEGRAM_SUBSCRIBERS_FILE:-/app/data/telegram_subscribers.json}
      - TELEGRAM_POLL_SECONDS=${TELEGRAM_POLL_SECONDS:-5}
    volumes:
      - notification_data:/app/data
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.5
    container_name: spark-master
    hostname: spark-master
    user: root
    command: >
      /bin/bash
      /opt/spark-apps/start-master-and-streaming-job.sh
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
    ports:
      - "7077:7077"
      - "8081:8080"
      - "4040:4040"
    volumes:
      - ./spark-apps:/opt/spark-apps
      - spark_checkpoints:/tmp/water-quality-checkpoints
      - spark_ivy:/tmp/spark-ivy
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.5
    container_name: spark-worker
    hostname: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 2
      --memory 2g
      spark://spark-master:7077
    ports:
      - "8082:8081"
    volumes:
      - ./spark-apps:/opt/spark-apps
      - spark_checkpoints:/tmp/water-quality-checkpoints
    depends_on:
      - spark-master

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra
    command: >
      /bin/bash
      /opt/cassandra-setup/start-cassandra-with-schema.sh
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: water-quality-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./cassandra:/opt/cassandra-setup:ro
    healthcheck:
      test: [ "CMD-SHELL", "/opt/cassandra/bin/cqlsh 127.0.0.1 9042 -e 'DESCRIBE TABLE water_quality.readings_daily_by_location_parameter' >/dev/null 2>&1" ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s



volumes:
  cassandra_data:
  spark_checkpoints:
  spark_ivy:
  notification_data:
