services:
  ph-sensor:
    build:
      context: ./sensor
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - --id=ph_sensor_0
      - --base-url=http://edge-server
    depends_on:
      edge-server:
        condition: service_healthy

  temp-sensor:
    build:
      context: ./sensor
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - --id=temp_sensor_0
      - --base-url=http://edge-server
    depends_on:
      edge-server:
        condition: service_healthy

  edge-server:
    build:
      context: ./server
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 0s
